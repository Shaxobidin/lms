# =============================================================================
# QDU LMS — virtual host konfiguratsiyasi
# =============================================================================

# HTTP -> HTTPS yo'naltirish
server {
    listen 80;
    server_name _;

    # Let's Encrypt tekshiruvi uchun istisno
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lms.qdu.uz;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Xavfsizlik sarlavhalari (NF-04, §11) -------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    # CSP: SCORM paketlari sandbox iframe'da ishlashi uchun frame-src o'ziga ruxsat
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://media.lms.qdu.uz; media-src 'self' blob: https://media.lms.qdu.uz; font-src 'self' data:; connect-src 'self' https://media.lms.qdu.uz; frame-src 'self' https://meet.jit.si; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    limit_conn conn_zone 50;

    # --- Autentifikatsiya endpointlari: qat'iy limit ------------------------
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|otp) {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://lms_api;
    }

    # --- SSE (bildirishnoma oqimi, ADR-010): buferlashsiz -------------------
    location /api/v1/stream {
        proxy_pass http://lms_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=100 nodelay;
        proxy_pass http://lms_api;
    }

    # --- Media (alohida yo'l; prod'da alohida subdomain tavsiya etiladi) -----
    location /media/ {
        limit_req zone=static_zone burst=200 nodelay;
        proxy_pass http://lms_media/;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        # Yuklab olishga majburlash o'rniga inline ko'rsatish faqat xavfsiz turlar uchun
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Next.js statik artefaktlari ----------------------------------------
    location /_next/static/ {
        proxy_pass http://lms_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Ilova --------------------------------------------------------------
    location / {
        proxy_pass http://lms_web;
    }
}
