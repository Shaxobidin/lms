# =============================================================================
# QDU LMS — Nginx asosiy konfiguratsiyasi (prod profil)
# Maqsad: TLS terminatsiyasi, reverse proxy, rate limit, statik keshlash.
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Loglar: JSON (NF-07 — strukturalangan loglar) ----------------------
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referrer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"trace_id":"$http_x_trace_id"'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Katta kontent (video, SCORM arxivlari) uchun
    client_max_body_size 512m;
    client_body_buffer_size 1m;

    # --- Siqish (past tezlikdagi internet — RSK-08) -------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/manifest+json;

    # --- Rate limit zonalari (NF-04, §8) ------------------------------------
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:20m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=static_zone:10m rate=600r/m;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # --- Upstream'lar --------------------------------------------------------
    upstream lms_api {
        least_conn;
        server api:4000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    upstream lms_web {
        least_conn;
        server web:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream lms_media {
        server minio:9000;
        keepalive 32;
    }

    # Proxy standart sozlamalari
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    include /etc/nginx/conf.d/*.conf;
}
