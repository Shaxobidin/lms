# =============================================================================
# QDU LMS — to'liq tizim (dev profil standart, prod profil `--profile prod`)
# Ishga tushirish: docker compose up -d
# =============================================================================

name: qdu-lms

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  TZ: ${TENANT_TIMEZONE:-Asia/Tashkent}

services:
  # ---------------------------------------------------------------- ma'lumot
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      # O'zbek tilidagi matnlar uchun to'g'ri saralash
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [lms-data]

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lms-data]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: lms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lms_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lms_minio_secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [lms-data]

  # Bucket'ni bir marta yaratadi va public read siyosatini o'rnatadi
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: lms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set lms http://minio:9000 ${S3_ACCESS_KEY:-lms_minio_admin} ${S3_SECRET_KEY:-lms_minio_secret} &&
      mc mb --ignore-existing lms/${S3_BUCKET:-lms-media} &&
      mc anonymous set download lms/${S3_BUCKET:-lms-media}/public &&
      echo 'MinIO bucket tayyor';
      "
    networks: [lms-data]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: lms-mailhog
    restart: unless-stopped
    ports:
      - '${SMTP_PORT_HOST:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'
    networks: [lms-data]

  # ----------------------------------------------------------------- ilova
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: lms-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms}@postgres:5432/${POSTGRES_DB:-lms}?schema=public&connection_limit=20
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      APP_ROLE: api
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [lms-data, lms-app]

  # Bir xil image, faqat APP_ROLE=worker — BullMQ processorlarini ishga tushiradi
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: lms-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms}@postgres:5432/${POSTGRES_DB:-lms}?schema=public&connection_limit=10
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      APP_ROLE: worker
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    networks: [lms-data, lms-app]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: lms-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *common-env
      # Brauzer uchun tashqi manzil, SSR uchun ichki manzil
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      INTERNAL_API_URL: http://api:4000/api/v1
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/messages:/app/apps/web/messages
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      api: { condition: service_started }
    networks: [lms-app]

  nginx:
    image: nginx:1.27-alpine
    container_name: lms-nginx
    restart: unless-stopped
    profiles: [prod]
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on: [api, web]
    networks: [lms-app, lms-data]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-cache:

networks:
  # Ma'lumotlar tarmog'i tashqariga chiqmaydi (xavfsizlik segmentatsiyasi)
  lms-data:
    driver: bridge
  lms-app:
    driver: bridge
